<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="天枢云 — 一个接口，接入全球前沿大模型">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080C16"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <radialGradient id="og-glow1" cx="0.18" cy="0.05" r="0.6">
      <stop stop-color="#5A78F0" stop-opacity=".38"/>
      <stop offset="1" stop-color="#5A78F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-glow2" cx="0.92" cy="0.75" r="0.55">
      <stop stop-color="#35E0C8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#35E0C8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9DB4FF"/>
      <stop offset=".52" stop-color="#6C8CFF"/>
      <stop offset="1" stop-color="#35E0C8"/>
    </linearGradient>
    <pattern id="og-grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#FFFFFF" stroke-opacity=".04"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-grid)"/>
  <rect width="1200" height="630" fill="url(#og-glow1)"/>
  <rect width="1200" height="630" fill="url(#og-glow2)"/>

  <g transform="translate(88 66)">
    <g transform="translate(0 0)">
      <rect x="6" y="6" width="30" height="30" rx="8" transform="rotate(45 21 21)"
            fill="none" stroke="url(#og-mark)" stroke-width="3"/>
      <circle cx="21" cy="21" r="4" fill="url(#og-mark)"/>
    </g>
    <text x="60" y="31" font-family="Inter, 'HarmonyOS Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="24" font-weight="700" fill="#F4F7FF" letter-spacing="1">天枢云</text>
    <text x="61" y="47" font-family="Inter, 'PingFang SC', sans-serif"
          font-size="9" font-weight="600" fill="#8E9BB3" letter-spacing="3">TIANSHU CLOUD</text>
  </g>

  <text x="88" y="300" font-family="Inter, 'HarmonyOS Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="82" font-weight="700" fill="#F7FAFF" letter-spacing="-2">一个接口，接入</text>
  <text x="88" y="400" font-family="Inter, 'HarmonyOS Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="82" font-weight="700" fill="#7FE3D1" letter-spacing="-2">全球前沿大模型</text>

  <text x="90" y="466" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="24" fill="#9AA7BF">OpenAI 兼容 · 文本 / 图像 / 视频全模态 · 按量计费</text>

  <g font-family="Inter, 'PingFang SC', sans-serif" font-size="16" fill="#C9D4E8">
    <rect x="88" y="520" width="150" height="42" rx="21" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
    <text x="116" y="547">100+ 模型</text>
    <rect x="254" y="520" width="170" height="42" rx="21" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
    <text x="282" y="547">7×24 智能路由</text>
    <rect x="440" y="520" width="196" height="42" rx="21" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
    <text x="468" y="547">分钟级接入</text>
  </g>

  <text x="1112" y="560" text-anchor="end" font-family="Inter, sans-serif" font-size="18" fill="#6C7791">www.tianshuapi.com</text>
</svg>
