<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 90 1040 780" role="img" aria-labelledby="title desc">
  <title id="title">澜算 H100 八卡 GPU 服务器</title>
  <desc id="desc">石墨黑与香槟金配色的 GPU 服务器产品渲染图，正面为八个计算模组，侧面为透明冷板与蓝色液冷管路。</desc>
