<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 雷达 · 实时追踪 AI 新应用</title>
<meta name="description" content="聚合 Hacker News、Product Hunt、GitHub、Hugging Face、机器之心等信源的 AI 应用雷达，每 5 分钟自动刷新。" />
<link rel="stylesheet" href="assets/style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox='0%200%2024%2024'%20xmlns='http://www.w3.org/2000/svg'%3E%3Crect%20width='24'%20height='24'%20rx='6'%20fill='%230a0d13'/%3E%3Ccircle%20cx='12'%20cy='12'%20r='2.4'%20fill='%232dd4bf'/%3E%3Ccircle%20cx='12'%20cy='12'%20r='6'%20fill='none'%20stroke='%232dd4bf'%20stroke-opacity='.5'%20stroke-width='1.5'/%3E%3C/svg%3E" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>
          <path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4"/>
          <path d="M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>AI 雷达</h1>
        <p>实时追踪 AI 新应用 · 新模型 · 新讨论</p>
      </div>
    </div>

    <div class="statusbar">
      <span class="status" id="status">
        <i class="dot" id="dot"></i>
        <span id="statusText">等待首次加载</span>
      </span>
      <span class="sep">·</span>
      <span class="countdown" id="countdown">—</span>
      <button class="btn" id="refreshBtn" title="立即刷新 (R)">刷新</button>
      <button class="btn" id="readBtn" title="把当前所有条目标记为已读">全部已读</button>
    </div>
  </div>
</header>

<main class="wrap">

  <noscript>
    <div class="empty">
      <p class="empty-title">需要启用 JavaScript</p>
      <p class="empty-sub">这个页面在浏览器里直接抓取并渲染各站内容，没有服务端。请允许本站运行脚本后刷新。</p>
    </div>
  </noscript>

  <section class="spotlight" id="spotlight" hidden></section>

  <section class="toolbar">
    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab is-active" data-tab="all" role="tab">全部</button>
      <button class="tab" data-tab="app" role="tab">新应用</button>
      <button class="tab" data-tab="open" role="tab">开源模型</button>
      <button class="tab" data-tab="community" role="tab">社区</button>
      <button class="tab" data-tab="news" role="tab">资讯</button>
    </nav>

    <div class="search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input id="search" type="search" placeholder="搜索标题或摘要…  (/ 聚焦)" autocomplete="off" spellcheck="false" />
    </div>

    <label class="toggle" title="只显示本次新抓到、你还没读过的条目">
      <input type="checkbox" id="onlyNew" />
      <span class="track"><span class="thumb"></span></span>
      <span class="label">只看新增</span>
    </label>
  </section>

  <section class="stats" id="stats"></section>

  <section class="grid" id="grid"></section>

  <div class="empty" id="empty" hidden>
    <p class="empty-title">暂时没有匹配的条目</p>
    <p class="empty-sub">换个关键词，或者切到「全部」看看。如果所有源都失败，通常是 CORS 代理被限流——刷新一次试试。</p>
  </div>

  <footer class="footer">
    <details class="health" id="health">
      <summary>信源状态 <span id="healthSummary" class="muted"></span></summary>
      <ul id="healthList" class="health-list"></ul>
    </details>
    <p class="disclaimer">
      数据来自各站点公开接口与 RSS，版权归原作者所有。<br />
      浏览器端每 <b id="refreshMin">5</b> 分钟拉取一次；页面关闭后不再更新。
    </p>
  </footer>

</main>

<script src="assets/sources.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
