      <stop offset="0" stop-color="#10291f"/>
      <stop offset="1" stop-color="#06130e"/>
    </linearGradient>
    <linearGradient id="bl-petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0ead8"/>
      <stop offset=".72" stop-color="#c8c2ab"/>
      <stop offset="1" stop-color="#8c8a78"/>
