<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 620" role="img" aria-label="Ink quiet power poster">
  <defs>
    <filter id="i-paper">
      <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".11"/></feComponentTransfer>
    </filter>
    <filter id="i-brush" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".028" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation=".35"/>
    </filter>
    <pattern id="i-fibers" width="23" height="23" patternUnits="userSpaceOnUse">
      <path d="M0 7h23M0 18h23" stroke="#5b4f3e" stroke-opacity=".035" stroke-width=".6"/>
    </pattern>
  </defs>
  <rect width="460" height="620" fill="#e8dfcf"/>
  <rect width="460" height="620" fill="url(#i-fibers)"/>
  <rect width="460" height="620" filter="url(#i-paper)" opacity=".7"/>

  <text x="29" y="42" fill="#1b1a17" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="2.8">INK STUDY</text>
  <text x="432" y="42" fill="#1b1a17" fill-opacity=".55" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.3" text-anchor="end">03 / 墨</text>
  <path d="M29 58h402" stroke="#1b1a17" stroke-opacity=".18"/>

  <g filter="url(#i-brush)">
    <path d="M312 166c52 18 75 87 55 151-20 63-79 119-148 120-63 1-116-41-117-99-1-54 41-94 82-95" fill="none" stroke="#171613" stroke-width="44" stroke-linecap="round"/>
    <path d="M110 345c-7-47 25-76 62-82 4 65 19 117 65 145-50 2-86-20-99-63z" fill="#171613" opacity=".86"/>
    <path d="M206 397c33 26 76 28 111 2" fill="none" stroke="#e8dfcf" stroke-width="13" stroke-linecap="round" opacity=".35"/>
  </g>

  <circle cx="341" cy="127" r="36" fill="#b93026"/>
  <g fill="#e8dfcf" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
    <text x="341" y="123">LUMEN</text>
    <text x="341" y="138">墨 · 气</text>
  </g>

  <g fill="#1b1a17" font-family="'Noto Serif SC', 'Songti SC', serif">
    <text x="392" y="99" font-size="15" letter-spacing="5" writing-mode="vertical-rl">留白，是给想象让路。</text>
  </g>

  <text x="29" y="522" fill="#1b1a17" font-family="Georgia, 'Times New Roman', serif" font-size="45" font-style="italic" letter-spacing="-2">Quiet</text>
  <text x="29" y="568" fill="#1b1a17" font-family="Georgia, 'Times New Roman', serif" font-size="45" font-style="italic" letter-spacing="-2">power.</text>
  <text x="29" y="596" fill="#1b1a17" fill-opacity=".55" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="2.1">NEGATIVE SPACE AS A MATERIAL</text>
</svg>
