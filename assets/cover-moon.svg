<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-label="月蚀契约封面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101612"/>
      <stop offset=".58" stop-color="#171b14"/>
      <stop offset="1" stop-color="#070907"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#d9b570" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#b38e4c" stop-opacity=".1"/>
      <stop offset="1" stop-color="#b38e4c" stop-opacity="0"/>
