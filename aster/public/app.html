<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>控制台 · ASTER</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

<div class="app-shell">
  <aside class="side" id="side">
    <a class="logo" href="/"><span class="logo-mark"></span> ASTER</a>

    <div class="side-group">工作台</div>
    <nav class="side-nav" id="navMain">
      <a href="#/dashboard" data-view="dashboard">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        概览
      </a>
      <a href="#/playground" data-view="playground">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v10H8l-4 4V5z"/></svg>
        演练场
      </a>
      <a href="#/models" data-view="models">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
        模型广场
      </a>
      <a href="#/keys" data-view="keys">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M15 12v2"/></svg>
        令牌管理
      </a>
      <a href="#/usage" data-view="usage">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19h16M7 16V9M12 16V5M17 16v-4"/></svg>
        用量明细
      </a>
      <a href="#/wallet" data-view="wallet">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h3M3 10h18"/></svg>
        钱包与账单
      </a>
    </nav>

    <div class="side-group">资源</div>
    <nav class="side-nav">
      <a href="/docs" target="_blank" rel="noopener">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h9a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H4V4z"/><path d="M20 4h-4v16"/></svg>
        接口文档
      </a>
      <a href="#/settings" data-view="settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3H9.8l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4.4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>
        账号设置
      </a>
    </nav>

    <div id="adminNav" style="display:none">
      <div class="side-group">管理后台</div>
      <nav class="side-nav" id="navAdmin">
        <a href="#/admin" data-view="admin">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 4v5c0 4.5-3.2 8.2-8 9-4.8-.8-8-4.5-8-9V7l8-4z"/></svg>
          运营概览
        </a>
        <a href="#/admin/models" data-view="admin-models">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
          模型与定价
        </a>
        <a href="#/admin/groups" data-view="admin-groups">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="3"/><circle cx="17" cy="15" r="3"/><path d="M4 20c0-3 2.2-5 5-5"/></svg>
          令牌分组
        </a>
        <a href="#/admin/upstreams" data-view="admin-upstreams">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 7h10v10H7z"/><path d="M3 12h4M17 12h4M12 3v4M12 17v4"/></svg>
          上游渠道
        </a>
        <a href="#/admin/users" data-view="admin-users">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3.1-6 7-6s7 2 7 6"/></svg>
          用户与额度
        </a>
        <a href="#/admin/ledger" data-view="admin-ledger">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6"/></svg>
          资金流水
        </a>
        <a href="#/admin/automation" data-view="admin-automation">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="3.6"/></svg>
          自动化引擎
        </a>
      </nav>
    </div>

    <div class="side-foot">
      <div>环境：<span id="envLabel">production</span></div>
      <div style="margin-top:6px"><a href="/" style="color:var(--dim)">← 返回官网</a></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" style="display:none" aria-label="菜单">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 id="pageTitle">概览</h1>
      <div class="spacer"></div>
      <a class="btn btn-sm" href="/docs" target="_blank" rel="noopener">文档</a>
      <div class="user-chip" id="userChip" style="cursor:pointer">
        <span class="avatar" id="avatar">A</span>
        <span id="userName">—</span>
      </div>
    </header>

    <main class="content" id="view">
      <div class="loading"><div class="spinner"></div>加载中…</div>
    </main>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast-wrap" id="toastRoot"></div>

<script src="/assets/app.js"></script>
</body>
</html>
