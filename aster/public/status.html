<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服务状态 · ASTER</title>
<meta name="description" content="ASTER 网关实时状态：各模型成功率、上游渠道健康度与自动故障处置记录。">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/styles.css">
<style>
  .status-hero { padding: 48px 0 8px; }
  .status-banner {
    display: flex; align-items: center; gap: 14px; padding: 22px 24px; border-radius: 14px;
    border: 1px solid rgba(52, 227, 164, 0.35); background: rgba(52, 227, 164, 0.08);
  }
  .status-banner.warn { border-color: rgba(255, 194, 88, 0.4); background: rgba(255, 194, 88, 0.08); }
  .status-banner .dot-lg { width: 12px; height: 12px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 16px var(--ok); }
  .status-banner.warn .dot-lg { background: var(--warn); box-shadow: 0 0 16px var(--warn); }
  .status-banner b { font-size: 17px; display: block; }
  .status-banner span { font-size: 12.5px; color: var(--muted); }
  .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0 26px; }
  .metric { padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .metric .k { font-size: 11.5px; color: var(--dim); letter-spacing: .06em; text-transform: uppercase; }
  .metric .v { font-size: 26px; font-weight: 650; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .metric .s { font-size: 11.5px; color: var(--dim); margin-top: 4px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 7px; background: var(--ok); }
  .dot.bad { background: var(--bad); }
  .dot.off { background: var(--dim); }
  .refresh { font-size: 11.5px; color: var(--dim); }
  @media (max-width: 760px) { .metric-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="logo" href="/"><span class="logo-mark"></span> ASTER</a>
    <nav class="nav-links">
      <a href="/#models">模型与价格</a>
      <a href="/docs">文档</a>
      <a href="/status">服务状态</a>
      <a href="/#faq">常见问题</a>
    </nav>
    <div class="nav-actions">
      <a class="btn btn-ghost btn-sm" href="/login">登录</a>
      <a class="btn btn-primary btn-sm" href="/register">免费开始</a>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="status-hero">
    <div id="banner" class="status-banner">
      <span class="dot-lg"></span>
      <div><b>正在获取实时状态…</b><span>数据每 30 秒自动刷新</span></div>
    </div>

    <div class="metric-grid" id="metrics"></div>

    <div class="grid-2" style="margin-bottom:22px">
      <div class="panel">
        <div class="panel-head"><h3>模型健康度（近 24 小时）</h3><span class="refresh" id="updated">—</span></div>
        <div class="panel-body tight">
          <table class="tbl compact"><thead><tr>
            <th>模型</th><th style="text-align:right">请求</th><th style="text-align:right">成功率</th><th style="text-align:right">平均延迟</th>
          </tr></thead><tbody id="modelRows">
            <tr><td colspan="4"><div class="loading"><div class="spinner"></div>加载中…</div></td></tr>
          </tbody></table>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>上游渠道</h3><span class="refresh">自动探活 · 失败自动下线</span></div>
        <div class="panel-body tight">
          <table class="tbl compact"><thead><tr>
            <th>渠道</th><th>协议</th><th style="text-align:right">成功率</th><th>状态</th>
          </tr></thead><tbody id="upRows"></tbody></table>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:40px">
      <div class="panel-head"><h3>自动处置记录</h3><span class="refresh">由自动化引擎写入，无需人工介入</span></div>
      <div class="panel-body tight">
        <table class="tbl compact"><thead><tr><th style="width:140px">时间</th><th>事件</th><th>详情</th></tr></thead>
          <tbody id="incRows"><tr><td colspan="3"><div class="empty">暂未发生需要处置的事件</div></td></tr></tbody>
        </table>
      </div>
    </div>

    <p class="tiny dim" style="margin-bottom:60px">
      状态页由网关自动维护：每 2 分钟探测一次上游，连续 3 次失败自动下线并切换到备用渠道，恢复后自动上线；
      所有动作都记录在上表中。计划内维护会提前 24 小时在控制台公告。
    </p>
  </section>
</main>

<footer class="site">
  <div class="wrap">
    <div class="foot-bottom" style="border-top:0;padding-top:0">
      <span>© 2026 星芒智能科技有限公司</span>
      <span><a href="/">返回首页</a> · <a href="/docs">文档</a> · <a href="/console">控制台</a></span>
    </div>
  </div>
</footer>

<script>
(function () {
  'use strict';
  function $(s) { return document.querySelector(s); }
  function pct(v) { return ((Number(v) || 0) * 100).toFixed(2) + '%'; }
  function ms(v) { return Math.round(Number(v) || 0) + ' ms'; }
  function dt(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    var p = function (x) { return String(x).padStart(2, '0'); };
    return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render(d) {
    var ok = d.uptime_1h.success_rate >= 0.99 && d.uptime_24h.success_rate >= 0.99;
    var banner = $('#banner');
    banner.className = 'status-banner' + (ok ? '' : ' warn');
    banner.innerHTML = '<span class="dot-lg"></span><div><b>' + (ok ? '全部系统运行正常' : '部分请求出现波动，正在自动处置') + '</b>' +
      '<span>近 1 小时成功率 ' + pct(d.uptime_1h.success_rate) + ' · 自动化引擎' + (d.automation.enabled ? '运行中' : '已暂停') + '</span></div>';

    $('#metrics').innerHTML = [
      { k: '近 1 小时', v: pct(d.uptime_1h.success_rate), s: d.uptime_1h.requests + ' 次请求 · ' + ms(d.uptime_1h.avg_latency) },
      { k: '近 24 小时', v: pct(d.uptime_24h.success_rate), s: d.uptime_24h.requests + ' 次请求 · ' + ms(d.uptime_24h.avg_latency) },
      { k: '近 7 天', v: pct(d.uptime_7d.success_rate), s: d.uptime_7d.requests + ' 次请求' }
    ].map(function (m) {
      return '<div class="metric"><div class="k">' + m.k + '</div><div class="v">' + m.v + '</div><div class="s">' + esc(m.s) + '</div></div>';
    }).join('');

    $('#updated').textContent = '更新于 ' + dt(d.updated_at);

    var mr = $('#modelRows');
    mr.innerHTML = (d.models && d.models.length)
      ? d.models.map(function (m) {
          var good = m.success_rate >= 0.99;
          return '<tr><td><span class="dot' + (good ? '' : ' bad') + '"></span>' + esc(m.name) + '</td>' +
            '<td class="mono tiny" style="text-align:right">' + m.requests + '</td>' +
            '<td class="mono tiny" style="text-align:right">' + pct(m.success_rate) + '</td>' +
            '<td class="mono tiny" style="text-align:right">' + ms(m.avg_latency) + '</td></tr>';
        }).join('')
      : '<tr><td colspan="4"><div class="empty">近 24 小时暂无调用</div></td></tr>';

    var ur = $('#upRows');
    ur.innerHTML = d.upstreams.map(function (u) {
      return '<tr><td>' + esc(u.name) + '</td><td class="mono tiny">' + esc(u.protocol) + '</td>' +
        '<td class="mono tiny" style="text-align:right">' + pct(u.success_rate) + '</td>' +
        '<td><span class="dot ' + (u.enabled ? '' : 'off') + '"></span>' + (u.enabled ? '启用' : '停用') + '</td></tr>';
    }).join('');

    var ir = $('#incRows');
    ir.innerHTML = (d.incidents && d.incidents.length)
      ? d.incidents.map(function (i) {
          return '<tr><td class="tiny dim">' + dt(i.ts) + '</td><td>' + esc(i.title) + '</td><td class="tiny dim">' + esc(i.detail) + '</td></tr>';
        }).join('')
      : '<tr><td colspan="3"><div class="empty">暂未发生需要处置的事件</div></td></tr>';
  }

  function load() {
    fetch('/api/public/status').then(function (r) { return r.json(); }).then(render).catch(function () {
      $('#banner').innerHTML = '<span class="dot-lg"></span><div><b>状态获取失败</b><span>请稍后刷新页面</span></div>';
    });
  }

  load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
